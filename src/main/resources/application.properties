spring.application.name=Vet&Go



# Datasource
spring.datasource.url=jdbc:mariadb://vetandgo-bank:3306/vetandgo-bank?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.url=jdbc:mariadb://vetandgo-bank:3306/vetandgo-bank?allowPublicKeyRetrieval=true&useSSL=false
spring.flyway.user=root
spring.flyway.password=root
spring.flyway.baseline-on-migrate=true
# spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
